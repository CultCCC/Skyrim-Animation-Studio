[workspace]
resolver = "2"
members = ["crates/vfs", "crates/hkx", "crates/anno", "crates/records", "crates/i18n", "crates/app", "crates/proj", "crates/proj-studio"]
exclude = ["vendor"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0"
authors = ["CultCCC"]

# Same profiles as Aether: egui/wgpu are slow at opt-level 0.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
