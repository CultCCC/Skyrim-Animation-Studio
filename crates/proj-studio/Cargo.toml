[package]
name = "sds-projectile-studio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SDS Projectile Studio — GUI editor of NewProjectilesTMP projectile chains, built on SDS Anim Studio crates"

[[bin]]
name = "sds-projectile-studio"
path = "src/main.rs"

[dependencies]
sds-i18n = { path = "../i18n" }
sds-vfs = { path = "../vfs" }
sds-records = { path = "../records" }
sds-proj = { path = "../proj" }
aether-core = { path = "../../vendor/aether/core" }
eframe = "0.34"
egui = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rfd = "0.15"
